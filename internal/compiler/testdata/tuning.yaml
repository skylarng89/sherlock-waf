schema_version: 1
global:
  defaults:
    waf:
      exclusions:
        - { id: global-health, match: { paths: ["/healthz"] }, remove_tags: [attack-sqli] }
sites:
  - id: shop
    hosts: [shop.example.com]
    tls: { mode: none }
    policy:
      mode: block
      stacks: [wordpress, php]
      waf:
        paranoia_level: 2
        blocking_paranoia_level: 1
        outbound_inspection: true
        outbound_max_body_bytes: 65536
        outbound_content_types: [text/html, application/json]
        exclusions:
          - id: search-box
            description: Search box triggers SQLi false positive
            match: { paths: ["/search"], methods: ["GET"] }
            remove_targets: [{ rule_ids: ["942100"], target: "ARGS:q" }]
        custom_rules: |
          SecRule REQUEST_FILENAME "@beginsWith /admin" "id:10001,phase:1,deny,status:403,msg:'Admin path blocked'"
    upstreams: { targets: ["10.0.1.10:8080"] }
    endpoints:
      - id: login
        match: { path: /wp-login.php, methods: [POST] }
        policy:
          waf: { paranoia_level: 3 }
          virtual_patches: { disabled: ["SV-2020-0001"] }
          opt_out: ["exclusions:global-health"]
  - id: blog
    hosts: [blog.example.com]
    tls: { mode: none }
    policy: { mode: block }
    upstreams: { targets: ["10.0.1.11:8080"] }
