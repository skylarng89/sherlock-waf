# Example Compose file for a single Sherlock WAF node. Copy it, edit the marked values, then:
#   docker compose up -d
#   docker compose exec sherlock sherlock user create --admin <name> --data-dir /var/lib/sherlock
# Docs: docs/user/install.md#docker and docs/operations/deployment.md
services:
  sherlock:
    # Pin a released tag (or better, a digest). Never use "latest" for a WAF.
    image: ghcr.io/skylarng89/sherlock-waf:<VERSION>
    container_name: sherlock
    restart: unless-stopped
    # The image's default command only runs the data plane from a YAML file. This starts the full node.
    command: ["run", "--data-dir", "/var/lib/sherlock"]
    # Distroless "nonroot" user; the image already sets it, stated here so it cannot drift.
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Lets the non-root process bind ports 80 and 443 inside the container without NET_BIND_SERVICE.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    volumes:
      # State: database, node key, certificates, backups. Back it up with `sherlock backup`.
      - sherlock-data:/var/lib/sherlock
    environment:
      # Listen address of the control plane (API and dashboard) inside the container.
      SHERLOCK_ADMIN_LISTEN: "0.0.0.0:9443"
      # Only these networks may reach the control plane. Set this to your management network.
      SHERLOCK_ADMIN_ALLOWED_CIDRS: "10.0.0.0/8"
      # Optional: PostgreSQL instead of SQLite in the data volume. Load the DSN from a secret, not this file.
      # SHERLOCK_DATABASE_URL: "postgres://sherlock:...@db.internal/sherlock?sslmode=verify-full"
      # Optional: keep the node key outside the data volume (mount it as a read-only secret).
      # SHERLOCK_NODE_KEY_FILE: /run/secrets/sherlock_node_key
    ports:
      - "80:80"
      - "443:443"
      # Control plane on the host loopback only. Reach it remotely through an SSH tunnel or a private network.
      - "127.0.0.1:9443:9443"
    # The image is distroless: no shell, curl or wget, so an HTTP probe of /readyz is not possible from inside.
    # This confirms the binary runs and the data directory is readable. For real readiness, probe
    # https://<host>:9443/readyz from your monitoring or load balancer (self-signed certificate).
    healthcheck:
      test: ["CMD", "/usr/local/bin/sherlock", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

volumes:
  sherlock-data:
