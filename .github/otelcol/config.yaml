# Collector used by the "otlp-collector" CI job: accepts OTLP and writes every
# log record to a file the job then inspects.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  file:
    path: /out/logs.json

service:
  pipelines:
    logs:
      receivers: [otlp]
      exporters: [file]
