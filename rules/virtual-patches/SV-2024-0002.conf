# SV-2024-0002: Palo Alto Networks PAN-OS GlobalProtect SESSID cookie command injection
# CVE-2024-3400. See SV-2024-0002.yaml for metadata and SV-2024-0002.tests.yaml for tests.
SecRule REQUEST_FILENAME "@rx (?i)^/(?:ssl-vpn|global-protect)/" "id:9500180,phase:1,t:none,deny,status:403,log,severity:'CRITICAL',msg:'Sherlock virtual patch SV-2024-0002: PAN-OS GlobalProtect SESSID injection',tag:'CVE-2024-3400',tag:'sherlock/virtual-patch',chain"
    SecRule REQUEST_COOKIES:SESSID "@rx [/\\`$;|&<>(){}]|\.\." "t:none,t:urlDecodeUni"
