# CVEs that the OWASP CRS already blocks at paranoia level 1 (docs/security/virtual-patching-process.md, outcome "Covered by CRS").
# Each entry carries the representative exploit request; TestCoveredByCRS replays it against a CRS-only instance and fails if the listed rules stop matching.
# JSON is used for the body because it is also valid YAML and keeps the request bytes exact.
{
