version: 2

before:
  hooks:
    - make web

builds:
  - id: sherlock
    main: ./cmd/sherlock
    binary: sherlock
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: "sherlock_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

nfpms:
  - id: sherlock
    package_name: sherlock-waf
    file_name_template: "sherlock_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Sherlock WAF
    homepage: https://github.com/skylarng89/sherlock-waf
    maintainer: Sherlock WAF maintainers
    description: Self-hosted web application and API firewall (Caddy, Coraza, OWASP CRS).
    license: AGPL-3.0-only
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/sherlock-waf/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/sherlock-waf/NOTICE
      - src: deploy/systemd/sherlock.service
        dst: /lib/systemd/system/sherlock.service
      - src: deploy/install/sherlock.env
        dst: /usr/share/sherlock-waf/sherlock.env
    scripts:
      postinstall: deploy/install/postinstall.sh
      preremove: deploy/install/preremove.sh

# SPDX SBOM per archive, generated by syft (pinned in tools/go.mod).
sboms:
  - id: archives
    artifacts: archive
    cmd: go
    args: ["tool", "-modfile={{ .Env.PWD }}/tools/go.mod", "syft", "$artifact", "--output", "spdx-json=$document", "--quiet"]
    documents: ["${artifact}.spdx.json"]

# Keyless cosign (GitHub OIDC identity) over the checksums and the SBOMs; the
# checksums cover every archive and package. Verification: docs/release/release-process.md.
signs:
  - id: checksums
    cmd: go
    args: ["tool", "-modfile={{ .Env.PWD }}/tools/go.mod", "cosign", "sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    signature: "${artifact}.sigstore.json"
    artifacts: checksum
  - id: sboms
    cmd: go
    args: ["tool", "-modfile={{ .Env.PWD }}/tools/go.mod", "cosign", "sign-blob", "--yes", "--bundle=${signature}", "${artifact}"]
    signature: "${artifact}.sigstore.json"
    artifacts: sbom

# Multi-arch image on a distroless nonroot base (see Dockerfile).
dockers_v2:
  - id: sherlock
    ids: [sherlock]
    dockerfile: Dockerfile
    images: [ghcr.io/skylarng89/sherlock-waf]
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.title: Sherlock WAF
      org.opencontainers.image.description: Self-hosted web application and API firewall
      org.opencontainers.image.source: https://github.com/skylarng89/sherlock-waf
      org.opencontainers.image.licenses: AGPL-3.0-only
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
    sbom: true

docker_signs:
  - id: images
    cmd: go
    args: ["tool", "-modfile={{ .Env.PWD }}/tools/go.mod", "cosign", "sign", "--yes", "${artifact}@${digest}"]
    artifacts: all

release:
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  disable: true # release-please owns CHANGELOG.md
